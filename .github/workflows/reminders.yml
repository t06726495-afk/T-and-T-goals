name: Reminders

# Runs every 15 minutes because a "9:00am reminder" lands at a different
# instant in every timezone, and because this doubles as the Supabase
# keepalive (a free project auto-pauses after 7 days of no activity).
#
# GitHub may skip or delay scheduled runs when the platform is busy; that's
# acceptable here since the endpoint is idempotent (last_reminder_on gates
# repeats, and delivered_at gates nudges).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi

          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "$APP_URL/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 60)

          echo "HTTP $status"
          cat /tmp/response.json || true
          echo

          if [ "$status" != "200" ]; then
            exit 1
          fi
